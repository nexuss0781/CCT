name: CCT-ASE Native Stage 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cpp/**"
      - "Makefile"
      - ".github/workflows/stage1.yml"

jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libfftw3-dev

      - name: Native Stage 1 test suite
        run: make stage1-test

      - name: Native Stage 1 gate
        run: make stage1-gate

      - name: Upload Stage 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stage1-artifacts
          path: artifacts/stage-1/
