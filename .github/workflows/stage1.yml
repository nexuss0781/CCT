name: CCT-ASE Stage 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "causa_py/**"
      - "tests/**"
      - "scripts/stage1_harness.py"
      - "Makefile"
      - ".github/workflows/stage1.yml"

jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install and build
        run: make install

      - name: Stage 1 tests
        run: make test-stage1

      - name: Stage 1 gate
        run: make stage1-gate

      - name: Upload Stage 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-artifacts
          path: artifacts/stage-1/
