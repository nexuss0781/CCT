name: CCT-ASE Stage 0

on:
  push:
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Install and build
        run: make install

      - name: Lint and compile checks
        run: make lint

      - name: Test suite
        run: make test

      - name: Smoke harness
        run: make benchmark-smoke

      - name: Stage 0 gate
        run: make report

      - name: Upload Stage 0 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-artifacts
          path: artifacts/stage-0/
