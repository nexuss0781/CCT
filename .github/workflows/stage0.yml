name: CCT-ASE Native Stage 0

on:
  push:
  pull_request:

jobs:
  stage0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libfftw3-dev

      - name: Build native project
        run: make native-build

      - name: Native CTest suite
        run: make native-test

      - name: Native Stage 0 gate
        run: make stage0-gate

      - name: Upload Stage 0 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stage0-artifacts
          path: artifacts/stage-0/
